name: stats

on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Dump insights
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python3 scripts/dump_stats.py stats.json
      - uses: actions/upload-artifact@v4
        with:
          name: stats
          path: stats.json
          retention-days: 3
