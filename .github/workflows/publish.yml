name: post-reel

on:
  schedule:
    # Two slots a day (three on 3-a-day dates, see publish.py) (8-10 am and 5-7 pm Chicago). GitHub delays scheduled runs by
    # hours or drops them, so fire many times per slot (odd minutes, less busy);
    # publish.py posts once per slot and the extra runs exit in seconds. UTC hours
    # cover both CDT and CST.
    # every half hour; publish.py decides whether a slot is due (7 main windows + trial lane)
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (don't actually post)"
        type: boolean
        default: true
      slot_check:
        description: "Only post if a slot is due (used by the Mac backup trigger)"
        type: boolean
        default: false

concurrency:   # never two runs at once -> never a double post
  group: post-reel
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Post next reel
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          MEDIA_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          SLOT_CHECK: ${{ inputs.slot_check }}
        run: python scripts/publish.py
      - name: Save queue state
        if: always()
        run: |
          git config user.name "reel-autopilot"
          git config user.email "reel-autopilot@users.noreply.github.com"
          git add queue.json
          git diff --cached --quiet || (git commit -m "queue: post $(date -u +%F)" && git pull --rebase && git push)
